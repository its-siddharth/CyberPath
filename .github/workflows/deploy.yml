name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect build strategy
        id: project
        run: |
          if [ -f package.json ]; then
            echo "has_node_project=true" >> "$GITHUB_OUTPUT"
            echo "artifact_path=./dist" >> "$GITHUB_OUTPUT"
          else
            echo "has_node_project=false" >> "$GITHUB_OUTPUT"
            echo "artifact_path=./" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: ${{ steps.project.outputs.has_node_project == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: ${{ steps.project.outputs.has_node_project == 'true' }}
        run: npm ci || npm install

      - name: Build production bundle
        if: ${{ steps.project.outputs.has_node_project == 'true' }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.project.outputs.artifact_path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
